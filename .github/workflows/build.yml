name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to attach the installer to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pyinstaller

      - name: Run tests
        run: python -m pytest -q

      - name: Build app folder
        run: pyinstaller --noconfirm --windowed --name PhotoDupeChecker --icon icon.ico --add-data "icon.ico;." --collect-all tkinterdnd2 --collect-all tifffile --collect-all imagecodecs --collect-all pillow_heif --collect-all pypdfium2 --collect-all rawpy app.py

      - name: Collect license texts into the app folder
        run: python collect_licenses.py dist/PhotoDupeChecker

      - name: Smoke-test the built app
        shell: pwsh
        run: |
          Start-Process -FilePath .\dist\PhotoDupeChecker\PhotoDupeChecker.exe -ArgumentList "--selftest","$PWD\selftest.txt" -Wait
          if (-not (Test-Path selftest.txt)) { throw "Self-test produced no output - the app did not start" }
          $r = Get-Content selftest.txt -Raw
          Write-Host $r
          if (-not $r.StartsWith("OK")) { throw "Self-test failed: $r" }

      - name: Work out version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          else {
            # Dev builds must sort just ABOVE the latest release, or Windows treats them as downgrades.
            $latest = gh release list --limit 1 --json tagName -q '.[0].tagName'
            if ($latest -match '^v(\d+)\.(\d+)\.(\d+)$') { $v = "$($Matches[1]).$($Matches[2]).$([int]$Matches[3] + 1)" }
            else { $v = "0.1.$env:GITHUB_RUN_NUMBER" }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Build MSI installer
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix build Package.wxs -arch x64 -d Version=${{ steps.ver.outputs.version }} -o PhotoDupeChecker-${{ steps.ver.outputs.version }}.msi

      - name: Test install, run, uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "PhotoDupeChecker-${{ steps.ver.outputs.version }}.msi").Path
          $p = Start-Process msiexec -ArgumentList "/i","`"$msi`"","/qn","/l*v","install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log -Tail 40; throw "Install failed: $($p.ExitCode)" }
          $exe = "C:\Program Files\Photo Duplicate Checker\PhotoDupeChecker.exe"
          if (-not (Test-Path $exe)) { throw "Installed exe missing" }
          if (-not (Test-Path "$env:PUBLIC\Desktop\Photo Duplicate Checker.lnk")) { throw "Desktop shortcut missing" }
          foreach ($f in "LICENSE.txt","THIRD_PARTY_NOTICES.txt","licenses\GPL-2.0.txt","licenses\LGPL-3.0.txt","licenses\python\LICENSE.txt","licenses\pillow_heif\LICENSES_bundled.txt") {
            if (-not (Test-Path "C:\Program Files\Photo Duplicate Checker\$f")) { throw "License file missing from the install: $f" }
          }
          Write-Host "License files installed: $((Get-ChildItem 'C:\Program Files\Photo Duplicate Checker\licenses' -Recurse -File).Count)"
          Remove-Item selftest.txt -ErrorAction SilentlyContinue
          Start-Process -FilePath $exe -ArgumentList "--selftest","$PWD\selftest.txt" -Wait
          $r = Get-Content selftest.txt -Raw
          Write-Host "Installed app: $r"
          if (-not $r.StartsWith("OK")) { throw "Installed app self-test failed: $r" }
          $u = Start-Process msiexec -ArgumentList "/x","`"$msi`"","/qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall failed: $($u.ExitCode)" }
          if (Test-Path "C:\Program Files\Photo Duplicate Checker") { throw "Uninstall left files behind" }
          Write-Host "Install / run / uninstall all OK"

      - name: Test upgrade over the previous release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $prev = gh release list --limit 10 --json tagName -q '.[].tagName' | Where-Object { $_ -ne $env:GITHUB_REF_NAME } | Select-Object -First 1
          if (-not $prev) { Write-Host "No earlier release to upgrade from - skipping"; exit 0 }
          Write-Host "Upgrading from $prev"
          New-Item -ItemType Directory prev | Out-Null
          gh release download $prev --pattern '*.msi' --dir prev
          $old = (Get-ChildItem prev\*.msi | Select-Object -First 1).FullName
          $new = (Resolve-Path "PhotoDupeChecker-${{ steps.ver.outputs.version }}.msi").Path
          $p = Start-Process msiexec -ArgumentList "/i","`"$old`"","/qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installing previous release failed: $($p.ExitCode)" }
          $p = Start-Process msiexec -ArgumentList "/i","`"$new`"","/qn","/l*v","upgrade.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Select-String -Path upgrade.log -Pattern "Error|1714|Return value 3" | Select-Object -First 15 | ForEach-Object { $_.Line }; throw "Upgrade failed: $($p.ExitCode)" }
          $entries = @(Get-ItemProperty "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*" | Where-Object { $_.DisplayName -eq "Photo Duplicate Checker" })
          if ($entries.Count -ne 1) { throw "Expected exactly one installed copy after upgrade, found $($entries.Count)" }
          if ($entries[0].DisplayVersion -ne "${{ steps.ver.outputs.version }}") { throw "Version after upgrade is $($entries[0].DisplayVersion)" }
          Remove-Item selftest.txt -ErrorAction SilentlyContinue
          Start-Process -FilePath "C:\Program Files\Photo Duplicate Checker\PhotoDupeChecker.exe" -ArgumentList "--selftest","$PWD\selftest.txt" -Wait
          $r = Get-Content selftest.txt -Raw
          Write-Host "After upgrade: $r"
          if (-not $r.StartsWith("OK")) { throw "App failed after upgrade: $r" }
          $u = Start-Process msiexec -ArgumentList "/x","`"$new`"","/qn" -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall after upgrade failed: $($u.ExitCode)" }
          Write-Host "Upgrade from $prev OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoDupeChecker-installer
          path: "*.msi"
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item *.msi).FullName --title "Photo Duplicate Checker $env:GITHUB_REF_NAME" --notes "Download the .msi below and double-click it to install."
